name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Gerar projeto Android (Expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK (release, assinado com chave de teste)
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk terry.apk

      - uses: actions/upload-artifact@v4
        with:
          name: terry-apk
          path: terry.apk

      - name: Publicar na página de releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" terry.apk \
            --title "TERRY Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "APK de teste do TERRY. Abra este link no celular Android, baixe terry.apk e instale. Commit ${GITHUB_SHA}." \
            --prerelease
